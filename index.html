<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EnglishPractice</title>
<style>
:root{
  --bg1:#e7ecfc;
  --bg2:#fbe9f6;
  --bg3:#e3f8f1;
  --bg4:#fff6e0;
  --glass:rgba(255,255,255,0.60);
  --glass-strong:rgba(255,255,255,0.86);
  --stroke:rgba(255,255,255,0.95);
  --stroke-soft:rgba(60,60,67,0.10);
  --ink:#1c1c1e;
  --ink-soft:#6e6e73;
  --accent:#0A84FF;
  --accent-2:#5AC8FA;
  --accent-soft:rgba(10,132,255,0.13);
  --green:#28A669;
  --green-soft:rgba(40,166,105,0.14);
  --red:#E5484D;
  --red-soft:rgba(229,72,77,0.12);
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:13px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 6%, var(--bg1) 0%, transparent 50%),
    radial-gradient(circle at 90% 10%, var(--bg2) 0%, transparent 50%),
    radial-gradient(circle at 15% 85%, var(--bg3) 0%, transparent 50%),
    radial-gradient(circle at 88% 92%, var(--bg4) 0%, transparent 50%),
    #f4f5f9;
  min-height:100vh;
  overscroll-behavior:none;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px);
  position:relative;
}

/* Top bar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  min-height:36px;
}
.topbar h1{
  font-size:1.5rem;
  font-weight:750;
  letter-spacing:-0.02em;
  margin:0;
}
.icon-btn{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  font-size:1.1rem;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
  transition:transform .15s var(--ease);
}
.icon-btn:active{transform:scale(0.9);}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.brand-badge{
  width:48px;height:48px;border-radius:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;
  box-shadow:0 8px 18px rgba(10,132,255,0.32), inset 0 1px 0 rgba(255,255,255,0.4);
  flex-shrink:0;
}
.brand-row h1{font-size:1.55rem;font-weight:800;letter-spacing:-0.02em;margin:0;line-height:1.1;}
.brand-sub{font-size:0.82rem;color:var(--ink-soft);margin:2px 0 0;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-row .icon-btn{width:32px;height:32px;font-size:1rem;}
.back-row .label{font-size:0.95rem;color:var(--ink-soft);font-weight:600;}

/* Glass card */
.card{
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--stroke);
  border-radius:var(--radius-lg);
  box-shadow:0 10px 34px rgba(31,41,55,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
  padding:20px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
}

/* List cards on home */
.set-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:16px 18px;
  cursor:pointer;
  transition:transform .18s var(--ease);
}
.set-card:active{transform:scale(0.98);}
.set-card .swatch{
  width:48px;height:48px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.35rem;
  flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
}
.set-card .info{flex:1; min-width:0;}
.set-card .info h3{margin:0 0 3px; font-size:1.04rem; font-weight:650; letter-spacing:-0.01em;}
.set-card .info p{margin:0; font-size:0.78rem; color:var(--ink-soft);}
.set-card .chev{color:var(--ink-soft); opacity:0.5; font-size:1rem;}
.set-card .del{
  width:26px;height:26px;border-radius:50%;
  background:rgba(120,120,128,0.1); color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem; flex-shrink:0; cursor:pointer;
  transition:all .15s var(--ease);
}
.set-card .del:active{background:var(--red-soft); color:var(--red); transform:scale(0.9);}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
}
.empty .em-icon{font-size:2.4rem;margin-bottom:10px;}
.empty h3{color:var(--ink); font-size:1.05rem; margin:0 0 6px;}
.empty p{font-size:0.85rem; margin:0 0 20px; line-height:1.4;}

/* Big CTA */
.cta{
  display:block;
  width:100%;
  padding:16px;
  border:none;
  border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-size:1rem;
  font-weight:650;
  letter-spacing:-0.01em;
  cursor:pointer;
  transition:transform .15s var(--ease), opacity .15s;
  box-shadow:0 8px 20px rgba(10,132,255,0.32);
}
.cta:disabled{opacity:0.45; box-shadow:none; cursor:default;}
.cta:disabled:active{transform:none;}
.cta:active{transform:scale(0.97);}
.cta.secondary{
  background:var(--glass-strong);
  color:var(--accent);
  box-shadow:none;
  border:1px solid var(--stroke-soft);
}

/* Form */
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:0.8rem;
  font-weight:650;
  color:var(--ink-soft);
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:0.02em;
}
.field input[type=text], .field textarea{
  width:100%;
  font-family:inherit;
  font-size:0.95rem;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--stroke-soft);
  background:rgba(255,255,255,0.7);
  color:var(--ink);
  resize:vertical;
}
.field textarea{min-height:150px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:0.78rem; line-height:1.5;}
.field input:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.hint{font-size:0.75rem; color:var(--ink-soft); margin-top:6px; line-height:1.4;}

.stepper{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,0.7);
  border-radius:var(--radius-sm);
  padding:8px 14px;
  border:1px solid var(--stroke-soft);
  width:fit-content;
}
.stepper button{
  width:30px;height:30px;border-radius:50%;
  border:none; background:var(--accent-soft); color:var(--accent);
  font-size:1.1rem; font-weight:700; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.stepper button:active{transform:scale(0.9);}
.stepper .val{font-size:1.05rem; font-weight:650; min-width:20px; text-align:center;}

.parse-preview{
  font-size:0.8rem;
  color:var(--ink-soft);
  background:var(--accent-soft);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  margin-bottom:16px;
  display:none;
}
.parse-preview.show{display:block;}
.parse-preview b{color:var(--accent);}
.parse-preview.warn{background:var(--red-soft); color:var(--red);}
.parse-preview.warn b{color:var(--red);}

/* Segmented control */
.segmented{
  display:flex;
  background:rgba(120,120,128,0.12);
  border-radius:var(--radius-sm);
  padding:3px;
  margin-bottom:14px;
}
.segmented button{
  flex:1;
  border:none;
  background:none;
  padding:8px 4px;
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
  border-radius:9px;
  cursor:pointer;
  transition:all .2s var(--ease);
}
.segmented button.active{
  background:var(--glass-strong);
  color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,0.12);
}

/* Day pills */
.day-pills{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;
  scrollbar-width:none;
}
.day-pills::-webkit-scrollbar{display:none;}
.day-pill{
  flex-shrink:0;
  padding:9px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.55);
  border:1px solid var(--stroke-soft);
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s var(--ease);
}
.day-pill.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}
.chip-select{
  flex-shrink:0;
  padding:9px 16px;
  border-radius:20px;
  background:var(--accent-soft);
  border:1.5px solid transparent;
  font-size:0.82rem;
  font-weight:600;
  color:var(--accent);
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s var(--ease);
}
.chip-select.off{
  background:rgba(120,120,128,0.1);
  color:var(--ink-soft);
}
.section-title{font-size:0.8rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.02em;margin:2px 0 10px;}

.wordlist{
  max-height:220px;
  overflow-y:auto;
  font-size:0.82rem;
  line-height:1.6;
}
.wordlist .row{
  display:flex; justify-content:space-between; gap:10px;
  padding:7px 0;
  border-bottom:1px solid rgba(60,60,67,0.08);
}
.wordlist .row:last-child{border-bottom:none;}
.wordlist .en{font-weight:600; color:var(--ink);}
.wordlist .fr{color:var(--ink-soft); text-align:right;}
.meta-line{font-size:0.78rem; color:var(--ink-soft); margin-bottom:12px;}

/* Quiz card */
.quiz-tag{
  display:inline-block;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.03em;
  color:#fff;
  background:var(--ink);
  padding:4px 10px;
  border-radius:8px;
  margin-bottom:14px;
}
.quiz-progress{
  display:flex; justify-content:space-between;
  font-size:0.78rem; color:var(--ink-soft);
  margin-bottom:6px;
}
.progress-bar{
  height:5px; border-radius:3px;
  background:rgba(60,60,67,0.12);
  overflow:hidden;
  margin-bottom:20px;
}
.progress-fill{
  height:100%; background:var(--accent);
  border-radius:3px;
  transition:width .3s var(--ease);
}
.prompt{
  font-size:1.35rem;
  font-weight:650;
  letter-spacing:-0.01em;
  line-height:1.3;
  margin-bottom:20px;
  min-height:2.6em;
  display:flex;align-items:center;
}
.answer-input{
  width:100%;
  font-size:1.05rem;
  padding:14px 16px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--stroke-soft);
  background:rgba(255,255,255,0.75);
  margin-bottom:14px;
  font-family:inherit;
}
.answer-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
.answer-input:disabled{opacity:0.7;}
.qrow{display:flex; gap:10px;}
.qrow button{
  border:none; border-radius:var(--radius-sm);
  padding:14px; font-size:0.95rem; font-weight:650;
  cursor:pointer; transition:transform .15s var(--ease);
}
.qrow button:active{transform:scale(0.97);}
.btn-check{background:var(--ink); color:#fff; flex:2;}
.btn-idk{background:rgba(120,120,128,0.12); color:var(--ink-soft); flex:1;}
.feedback{
  margin-top:14px; padding:13px 15px; border-radius:var(--radius-sm);
  font-size:0.9rem; display:none; line-height:1.4;
}
.feedback.good{display:block; background:var(--green-soft); color:var(--green);}
.feedback.close{display:block; background:rgba(255,159,10,0.14); color:#B87400;}
.feedback.bad{display:block; background:var(--red-soft); color:var(--red);}
.feedback b{color:var(--ink);}
.next-btn{
  display:none; width:100%; margin-top:12px;
  padding:14px; border:none; border-radius:var(--radius-sm);
  background:var(--accent); color:#fff; font-size:0.95rem; font-weight:650;
  cursor:pointer;
}

.done-wrap{text-align:center; padding:20px 8px 6px;}
.done-score{font-size:2.6rem; font-weight:750; color:var(--ink); letter-spacing:-0.02em;}
.done-wrap p{color:var(--ink-soft); font-size:0.85rem; margin:4px 0 18px;}

/* Bottom tab bar */
.tabbar{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex;
  justify-content:center;
  padding:0 16px calc(env(safe-area-inset-bottom) + 12px);
  pointer-events:none;
}
.tabbar-inner{
  pointer-events:auto;
  max-width:480px;
  width:100%;
  display:flex;
  background:var(--glass-strong);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);
  border-radius:22px;
  box-shadow:0 10px 30px rgba(31,41,55,0.14);
  padding:8px;
  gap:4px;
}
.tab-btn{
  flex:1;
  border:none; background:none;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 4px;
  border-radius:16px;
  color:var(--ink-soft);
  font-size:0.68rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s var(--ease);
}
.tab-btn .ti{font-size:1.15rem;}
.tab-btn.active{background:var(--accent-soft); color:var(--accent); box-shadow:0 0 0 1px rgba(10,132,255,0.12) inset;}

.toast{
  position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,0.92); color:#fff;
  padding:11px 20px; border-radius:16px; font-size:0.85rem; font-weight:600;
  opacity:0; transition:all .3s var(--ease); pointer-events:none;
  backdrop-filter:blur(10px);
  z-index:50;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.loading{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:0.9rem;}

.auth-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.auth-actions .cta{flex:1;min-width:140px}.auth-note{font-size:.82rem;color:var(--ink-soft);line-height:1.45;margin-top:12px}.auth-switch{text-align:center;margin-top:14px;font-size:.86rem;color:var(--ink-soft)}.auth-switch button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}.danger{background:#fff0f0!important;color:#c62828!important;border:1px solid #f2b8b8!important}.account-email{font-size:.84rem;color:var(--ink-soft);margin-top:4px;word-break:break-all}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function stripArticles(s){
  return s.replace(/^(to |an |a |the |une |un |les |la |le |l')/i,'').trim();
}
function normalize(s){
  return stripArticles(s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[()]/g,'').trim());
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function closestDistance(input, alternatives){
  return Math.min(...alternatives.map(alt=>levenshtein(input,alt)));
}
function isCloseEnough(dist, len){
  return dist>0 && dist <= (len<=5 ? 1 : 2);
}

function pairKey(en, fr, dir){ return en+'|||'+fr+'|||'+dir; }
function repsFor(statsObj, key){
  const stat = statsObj && statsObj[key];
  if(!stat) return 1;
  const extra = Math.max(0, Math.min(2, stat.wrong - stat.right));
  return 1 + extra;
}
async function recordAnswer(item, correct){

  setObj.stats = setObj.stats || {};

  setObj.stats[item.key] = s;

}
function formatRelative(ts){
  if(!ts) return 'Jamais révisée';
  const diffMs = Date.now() - ts;
  const day = 86400000;
  const days = Math.floor(diffMs / day);
  if(days <= 0) return "Révisée aujourd'hui";
  if(days === 1) return 'Révisée hier';
  if(days < 7) return `Révisée il y a ${days} jours`;
  if(days < 30) return `Révisée il y a ${Math.floor(days/7)} sem.`;
  return `Révisée il y a ${Math.floor(days/30)} mois`;
}
function priorityCount(setObj, items){
  const stats = setObj.stats || {};
  return items.filter(([en,fr])=>{
    const a = stats[pairKey(en,fr,'fr2en')], b = stats[pairKey(en,fr,'en2fr')];
    return (a && a.wrong > a.right) || (b && b.wrong > b.right);
  }).length;
}

// ---------- Parsing pasted lists ----------
// Accepts tab-separated (Anki export), " - " / " – " / " : " separated lines,
// or 2+ spaces used as a column separator — whichever the pasted list uses.
function splitLine(line){
  if(line.includes('\t')) return line.split('\t');
  if(/\s-\s/.test(line)) return line.split(/\s-\s/);
  if(/\s–\s/.test(line)) return line.split(/\s–\s/);
  if(line.includes(' : ')) return line.split(' : ');
  if(/\s{2,}/.test(line)) return line.split(/\s{2,}/);
  return [line];
}
function parseVocabText(text){
  const rawLines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const pairs = [];
  const seenKeys = new Set();
  for(const line of rawLines){
    const parts = splitLine(line);
    if(parts.length < 2) continue;
    const a = parts[0].trim(), b = parts.slice(1).join(' - ').trim();
    if(!a || !b) continue;
    const revKey = (b+'|||'+a).toLowerCase();
    if(seenKeys.has(revKey)) continue; // this is the reverse of a pair we already kept
    const fwdKey = (a+'|||'+b).toLowerCase();
    if(seenKeys.has(fwdKey)) continue;
    seenKeys.add(fwdKey);
    pairs.push([a,b]);
  }
  return pairs;
}

function chunkIntoDays(pairs, dayCount){
  const n = pairs.length;
  const base = Math.floor(n/dayCount), rem = n%dayCount;
  const days = [];
  let idx=0;
  for(let d=0; d<dayCount; d++){
    const size = base + (d < rem ? 1 : 0);
    days.push({ title:`Partie ${d+1}`, items: pairs.slice(idx, idx+size) });
    idx += size;
  }
  return days.filter(d=>d.items.length>0);
}

    btn.textContent = 'Enregistrement...'; btn.disabled = true;
    const ok = await sSet('set:'+currentSetObj.id, currentSetObj);
    const idx = sets.find(s=>s.id===currentSetObj.id);
    if(idx){
      idx.itemCount = currentSetObj.days.reduce((a,d)=>a+d.items.length,0);
      idx.dayCount = currentSetObj.days.length;
    }
    await saveIndex();
    if(!ok){ showToast('Échec de l\u2019enregistrement'); btn.textContent='Ajouter à la liste'; btn.disabled=false; return; }
    showToast(`${pendingEditPairs.length} mot${pendingEditPairs.length>1?'s':''} ajouté${pendingEditPairs.length>1?'s':''} ✓`);
    VIEW = 'set';
    render();
  };
}

let currentSetObj = null;
async function openSet(id){
  currentSetId = id;
  currentSetObj = await sGet('set:'+id);
  if(!currentSetObj){ showToast('Liste introuvable'); return; }
  currentSetObj.stats = currentSetObj.stats || {};
  loadedSets[id] = currentSetObj;
  currentDayIdx = 0;
  VIEW = 'set';
  render();
}

function renderSet(){
  if(!currentSetObj){
    appEl.innerHTML = `<div class="loading">Chargement...</div>${tabbarHtml()}`;
    bindTabbar();
    return;
  }
  const day = currentSetObj.days[currentDayIdx];
  const pillsHtml = currentSetObj.days.map((d,i)=>
    `<div class="day-pill ${i===currentDayIdx?'active':''}" data-i="${i}">Jour ${i+1} · ${d.items.length}</div>`
  ).join('');
  const wordRows = day.items.map(([en,fr])=>
    `<div class="row"><span class="en">${escapeHtml(en)}</span><span class="fr">${escapeHtml(fr)}</span></div>`
  ).join('');
  const prio = priorityCount(currentSetObj, day.items);

  appEl.innerHTML = `
    <div class="back-row">
      <div class="icon-btn" id="backBtn">‹</div>
      <div class="label">${escapeHtml(currentSetObj.title)}</div>
      <div class="icon-btn" id="editSetBtn" style="margin-left:auto;">✎</div>
    </div>
    <div class="day-pills">${pillsHtml}</div>
    <div class="card">
      <div class="meta-line">${day.items.length} expressions — relis-les puis restitue-les de mémoire avant l'exercice.${prio>0 ? `<br><b style="color:var(--accent)">★ ${prio} mot${prio>1?'s':''} à retravailler en priorité</b> (les cartes ratées reviennent plus souvent).` : ''}</div>
      <div class="wordlist">${wordRows}</div>
    </div>
    <div class="segmented" id="dirSeg">
      <button data-dir="mix" class="${quiz.direction==='mix'?'active':''}">Mélangé</button>
      <button data-dir="fr2en" class="${quiz.direction==='fr2en'?'active':''}">FR → EN</button>
      <button data-dir="en2fr" class="${quiz.direction==='en2fr'?'active':''}">EN → FR</button>
    </div>
    <div id="quizArea"></div>
    ${tabbarHtml()}
  `;
  bindTabbar();
  document.getElementById('backBtn').onclick = ()=>{ VIEW='home'; render(); };
  document.getElementById('editSetBtn').onclick = ()=>{ VIEW='editSet'; render(); };
  appEl.querySelectorAll('.day-pill').forEach(p=>{
    p.onclick = ()=>{ currentDayIdx = parseInt(p.dataset.i); buildQueue(); render(); };
  });
  appEl.querySelectorAll('#dirSeg button').forEach(b=>{
    b.onclick = ()=>{ quiz.direction = b.dataset.dir; buildQueue(); renderQuiz(); updateSegActive(); };
  });
  if(quiz.queue.length===0 || quiz._day!==currentDayIdx) buildQueue();
  quiz.rebuild = buildQueue;
  renderQuiz();
}

function updateSegActive(){
  document.querySelectorAll('#dirSeg button').forEach(b=>{
    b.classList.toggle('active', b.dataset.dir===quiz.direction);
  });
}

function buildQueue(){
  const day = currentSetObj.days[currentDayIdx];
  const stats = currentSetObj.stats || {};
  let list = [];
  day.items.forEach(([en,fr])=>{
    const dirs = quiz.direction==='mix' ? ['fr2en','en2fr'] : [quiz.direction];
    dirs.forEach(dir=>{
      const key = pairKey(en,fr,dir);
      const q = dir==='fr2en'?fr:en, a = dir==='fr2en'?en:fr;
      const reps = repsFor(stats, key);
      for(let r=0;r<reps;r++) list.push({q,a,dir,setId:currentSetId,key});
    });
  });
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  quiz.queue = list; quiz.index=0; quiz.score=0; quiz.answered=false; quiz._day = currentDayIdx;
}

function selectedItemsForReview(){
  let items = [];
  sets.forEach(s=>{
    if(!reviewSelection || !reviewSelection.has(s.id)) return;
    const full = loadedSets[s.id];
    if(!full) return;
    full.days.forEach(d=> d.items.forEach(([en,fr])=> items.push({en,fr,setId:s.id})));
  });
  return items;
}

function buildReviewQueue(){
  const items = selectedItemsForReview();
  let list = [];
  items.forEach(({en,fr,setId})=>{
    const stats = (loadedSets[setId] && loadedSets[setId].stats) || {};
    const dirs = quiz.direction==='mix' ? ['fr2en','en2fr'] : [quiz.direction];
    dirs.forEach(dir=>{
      const key = pairKey(en,fr,dir);
      const q = dir==='fr2en'?fr:en, a = dir==='fr2en'?en:fr;
      const reps = repsFor(stats, key);
      for(let r=0;r<reps;r++) list.push({q,a,dir,setId,key});
    });
  });
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  quiz.queue = list; quiz.index=0; quiz.score=0; quiz.answered=false; quiz._day=null;
}

async function renderReviewAll(){
  if(sets.length===0){
    appEl.innerHTML = `
      <div class="brand-row"><div class="brand-badge">🔁</div><div><h1>Réviser tout</h1><p class="brand-sub">Mélange plusieurs listes</p></div></div>
      <div class="empty"><div class="em-icon">📭</div><h3>Pas encore de liste</h3><p>Ajoute au moins une liste pour pouvoir la réviser ici.</p></div>
      ${tabbarHtml()}`;
    bindTabbar();
    return;
  }
  if(!reviewStarted){
    appEl.innerHTML = `<div class="loading">Préparation...</div>`;
    for(const s of sets){
      if(!loadedSets[s.id]){
        const f = await sGet('set:'+s.id);
        loadedSets[s.id] = f || {id:s.id, title:s.title, days:[], stats:{}};
      }
      loadedSets[s.id].stats = loadedSets[s.id].stats || {};
    }
    if(reviewSelection===null) reviewSelection = new Set(sets.map(s=>s.id));
  }

  let bodyHtml;
  if(!reviewStarted){
    const chips = sets.slice().sort((a,b)=>b.createdAt-a.createdAt).map(s=>{
      const on = reviewSelection.has(s.id);
      return `<div class="chip-select ${on?'':'off'}" data-id="${s.id}">${on?'✓ ':''}${escapeHtml(s.title)}</div>`;
    }).join('');
    const totalItems = selectedItemsForReview().length;
    bodyHtml = `
      <div class="card">
        <div class="section-title">Listes incluses</div>
        <div class="day-pills" id="chipRow">${chips}</div>
        <div class="section-title" style="margin-top:14px;">Sens</div>
        <div class="segmented" id="dirSegAll">
          <button data-dir="mix" class="${quiz.direction==='mix'?'active':''}">Mélangé</button>
          <button data-dir="fr2en" class="${quiz.direction==='fr2en'?'active':''}">FR → EN</button>
          <button data-dir="en2fr" class="${quiz.direction==='en2fr'?'active':''}">EN → FR</button>
        </div>
        <div class="meta-line">${totalItems} mot${totalItems>1?'s':''} sélectionné${totalItems>1?'s':''}, toutes listes confondues.</div>
        <button class="cta" id="launchReviewBtn" ${totalItems===0?'disabled':''}>Lancer la révision</button>
      </div>`;
  } else {
    bodyHtml = `
      <div class="back-row" style="margin-bottom:10px;">
        <div class="icon-btn" id="reviewBackBtn">‹</div>
        <div class="label">Modifier la sélection</div>
      </div>
      <div id="quizArea"></div>`;
  }

  appEl.innerHTML = `
    <div class="brand-row">
      <div class="brand-badge">🔁</div>
      <div><h1>Réviser tout</h1><p class="brand-sub">Mélange plusieurs listes pour ne rien oublier</p></div>
    </div>
    ${bodyHtml}
    ${tabbarHtml()}
  `;
  bindTabbar();

  if(!reviewStarted){
    appEl.querySelectorAll('#chipRow .chip-select').forEach(chip=>{
      chip.onclick = ()=>{
        const id = chip.dataset.id;
        if(reviewSelection.has(id)) reviewSelection.delete(id); else reviewSelection.add(id);
        renderReviewAll();
      };
    });
    appEl.querySelectorAll('#dirSegAll button').forEach(b=>{
      b.onclick = ()=>{ quiz.direction = b.dataset.dir; renderReviewAll(); };
    });
    document.getElementById('launchReviewBtn')?.addEventListener('click', ()=>{
      buildReviewQueue();
      reviewStarted = true;
      quiz.rebuild = buildReviewQueue;
      render();
    });
  } else {
    document.getElementById('reviewBackBtn').onclick = ()=>{ reviewStarted=false; render(); };
    if(quiz.queue.length===0) buildReviewQueue();
    quiz.rebuild = buildReviewQueue;
    renderQuiz();
  }
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  if(quiz.index >= quiz.queue.length){
    area.innerHTML = `
      <div class="card done-wrap">
        <div class="done-score">${quiz.score}/${quiz.queue.length}</div>
        <p>Score sur ce passage</p>
        <button class="cta" id="restartBtn" style="max-width:220px;margin:0 auto;">Relancer</button>
      </div>`;
    document.getElementById('restartBtn').onclick = ()=>{ quiz.rebuild(); renderQuiz(); };
    return;
  }
  const item = quiz.queue[quiz.index];
  const pct = Math.round((quiz.index/quiz.queue.length)*100);
  area.innerHTML = `
    <div class="card">
      <span class="quiz-tag">${item.dir==='fr2en'?'FR → EN':'EN → FR'}</span>
      <div class="quiz-progress"><span>Carte ${quiz.index+1}/${quiz.queue.length}</span><span>Score ${quiz.score}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="prompt">${escapeHtml(item.q)}</div>
      <input type="text" class="answer-input" id="ansInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse...">
      <div class="qrow">
        <button class="btn-check" id="checkBtn">Vérifier</button>
        <button class="btn-idk" id="idkBtn">Je ne sais pas</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Carte suivante →</button>
    </div>
  `;
  const input = document.getElementById('ansInput');
  input.focus();
  document.getElementById('checkBtn').onclick = checkAnswer;
  document.getElementById('idkBtn').onclick = ()=>reveal(false);
  document.getElementById('nextBtn').onclick = ()=>{ quiz.index++; quiz.answered=false; renderQuiz(); };
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ if(!quiz.answered) checkAnswer(); else { quiz.index++; quiz.answered=false; renderQuiz(); } }
  });
}

function checkAnswer(){
  const input = document.getElementById('ansInput');
  if(!input.value.trim()) return;
  const item = quiz.queue[quiz.index];
  const alts = splitAlternatives(item.a).map(normalize);
  const userNorm = normalize(input.value);
  const correct = alts.includes(userNorm);
  let close = false;
  if(!correct){
    const dist = closestDistance(userNorm, alts);
    close = isCloseEnough(dist, userNorm.length);
  }
  if(correct) quiz.score++;
  reveal(correct, close);
}

function reveal(correct, close){
  quiz.answered = true;
  const item = quiz.queue[quiz.index];
  const fb = document.getElementById('feedback');
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('idkBtn').style.display='none';
  document.getElementById('ansInput').disabled = true;
  fb.className = 'feedback ' + (correct?'good':(close?'close':'bad'));
  if(correct) fb.innerHTML = '✓ Correct — <b>'+escapeHtml(item.a)+'</b>';
  else if(close) fb.innerHTML = '➜ Presque ! Attention à l\u2019orthographe — <b>'+escapeHtml(item.a)+'</b>';
  else fb.innerHTML = '✗ Réponse : <b>'+escapeHtml(item.a)+'</b>';
  document.getElementById('nextBtn').style.display = 'block';
  recordAnswer(item, correct);
}

// ---------- Account ----------
function showProfileGate(){ showAuthGate(); }
async function chooseProfile(name){ PROFILE=name; await startApp(); }
function switchProfile(){
  if(!AUTH_USER){showAuthGate();return;}
  appEl.innerHTML=`<div class="brand-row" style="margin-top:36px;"><div class="brand-badge">📘</div><div style="flex:1;"><h1>Mon compte</h1><p class="brand-sub">${escapeHtml(AUTH_USER.email||'')}</p></div></div>
  <div class="card"><div class="section-title">Compte</div><p class="account-email">${escapeHtml(AUTH_USER.email||'')}</p>
  <div class="auth-actions"><button class="cta" id="accountBack">Retour</button><button class="cta danger" id="deleteAccountBtn">Supprimer mon compte</button></div>
  <div class="auth-actions"><button class="cta" id="logoutBtn">Se déconnecter</button></div></div>`;
  document.getElementById('accountBack').onclick=()=>{VIEW='home';render();};
  document.getElementById('logoutBtn').onclick=signOut;
  document.getElementById('deleteAccountBtn').onclick=deleteAccount;
}

async function startApp(){
  appEl.innerHTML=`<div class="loading">Chargement de tes listes...</div>`;
  try{ await loadIndex(); render(); }
  catch(err){ appEl.innerHTML=`<div class="loading">Un problème est survenu au chargement.<br><br>${escapeHtml(String(err&&err.message||err))}</div>`; }
}

// ---------- Init ----------
(async function init(){
  if(!supabaseConfigured){showAuthGate();return;}
  try{
    const {data}=await sb.auth.getSession();
    AUTH_USER=data?.session?.user||null;
    if(AUTH_USER){
      let legacyProfile=null; try{ legacyProfile=localStorage.getItem(LS_PREFIX+'activeProfile'); }catch(x){}
      PROFILE=(AUTH_USER.user_metadata?.name || AUTH_USER.email?.split('@')[0] || 'Utilisateur').trim();
      setActiveProfile(PROFILE);
      await migrateLocalProfileIfNeeded(legacyProfile);
      await startApp();
    }else showAuthGate();
    sb.auth.onAuthStateChange(async (_event,session)=>{
      if(session?.user && !AUTH_USER){
        AUTH_USER=session.user; PROFILE=(AUTH_USER.user_metadata?.name||AUTH_USER.email?.split('@')[0]||'Utilisateur').trim(); setActiveProfile(PROFILE); await startApp();
      }
    });
  }catch(err){showAuthGate(authErrorMessage(err));}
})();
</script>
